[workspace]
members = [
    "constellation-core/compiler/cobra_lexer_quantum",
    "constellation-core/compiler/cobra_parser_ast",
    "constellation-core/compiler/cobra_diagnostics_telemetry",
    "quantum-runtimes/runtime_core_os",
    "interstellar-suites/cobrac",
    "automated-labs/dynamic_fuzzing",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Cobra Federation"]

[workspace.dependencies]
cobra-lexer-quantum = { path = "constellation-core/compiler/cobra_lexer_quantum" }
cobra-parser-ast = { path = "constellation-core/compiler/cobra_parser_ast" }
cobra-diagnostics-telemetry = { path = "constellation-core/compiler/cobra_diagnostics_telemetry" }
cobra-runtime-core = { path = "quantum-runtimes/runtime_core_os" }